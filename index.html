<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Absolute Swiss Simulator - Production Cloud Master</title>
  <!-- Loading the professional 3D core graphics engine securely -->
  <script src="https://cloudflare.com"></script>
  
  <style>
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #0f172a; user-select: none;
    }
    /* Full screen canvas viewport layout configuration overrides */
    #panorama-viewport {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0; cursor: grab; z-index: 1;
    }
    #panorama-viewport:active { cursor: grabbing; }

    /* Floating HUD Status Bar Layout */
    #concierge-hud {
      position: absolute; top: 30px; left: 30px; z-index: 10; 
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(15px); 
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 15px 25px; 
      color: #fff; border-radius: 4px; letter-spacing: 3px; font-size: 11px; 
      text-transform: uppercase; pointer-events: none; font-family: sans-serif;
    }
  </style>
</head>
<body>

  <!-- THE STATUS BAR HUD -->
  <div id="concierge-hud">
    <span id="hud-text">THE ABSOLUTE SWISS SIMULATOR &bull; STAGE 01</span>
  </div>

  <!-- THE 3D VIEWPORT LAYER CONTAINER -->
  <div id="panorama-viewport"></div>

  <!-- THREE.JS SELF-CONTAINED 3D ENGINE GRAPHICS CARD ROUTINE -->
  <script>
    let scene, camera, renderer, sphere;
    let isUserInteracting = false;
    let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
    let lon = 0, onPointerDownLon = 0;
    let lat = 0, onPointerDownLat = 0;
    let phi = 0, theta = 0;
    let currentStage = 1;

    init();
    animate();

    function init() {
      const container = document.getElementById('panorama-viewport');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

      // Create a perfect geometric sphere to act as our 360° bubble dome shell
      const geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1, 1, 1); // Invert sphere out so you stand cleanly on the inside

      // SELF-CONTAINED PROCEDURAL TEXTURE LAYOUT MATRIX
      // Generates beautiful full-screen horizons natively to bypass missing local asset blocks
      const canvas = document.createElement('canvas');
      canvas.width = 2; canvas.height = 2;
      const context = canvas.getContext('2d');
      
      // Initial Stage 1 sapphire blue alpine dawn gradient setup
      const gradient = context.createLinearGradient(0, 0, 0, 2);
      gradient.addColorStop(0, '#0284c7');
      gradient.addColorStop(1, '#bae6fd');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 2, 2);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.MeshBasicMaterial({ map: texture });
      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);

      // WebGL Renderer Core mapping setup
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Desktop First-Person Mouse Track Bindings
      document.addEventListener('pointerdown', onPointerDown, false);
      document.addEventListener('dblclick', triggerStageTransit, false);
      window.addEventListener('resize', onWindowResize, false);

      // Automated layout push forces initialization loops instantly on load
      forceGraphicsRefresh();
    }

    function forceGraphicsRefresh() {
      if (renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.render(scene, camera);
      }
    }

    function onWindowResize() {
      forceGraphicsRefresh();
    }

    function onPointerDown(event) {
      isUserInteracting = true;
      onPointerDownPointerX = event.clientX;
      onPointerDownPointerY = event.clientY;
      onPointerDownLon = lon;
      onPointerDownLat = lat;
      document.addEventListener('pointermove', onPointerMove, false);
      document.addEventListener('pointerup', onPointerUp, false);
    }

    function onPointerMove(event) {
      if (isUserInteracting === false) return;
      lon = (onPointerDownPointerX - event.clientX) * 0.1 + onPointerDownLon;
      lat = (event.clientY - onPointerDownPointerY) * 0.1 + onPointerDownLat;
    }

    function onPointerUp() {
      isUserInteracting = false;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
    }

    // Teleports view variables cleanly to Stage 2 emerald mountain sunset gradients with zero file lags
    function triggerStageTransit() {
      const canvas = document.createElement('canvas');
      canvas.width = 2; canvas.height = 2;
      const context = canvas.getContext('2d');
      const gradient = context.createLinearGradient(0, 0, 0, 2);

      if (currentStage === 1) {
        currentStage = 2;
        gradient.addColorStop(0, '#064e3b');
        gradient.addColorStop(1, '#6ee7b7');
        document.getElementById('hud-text').innerHTML = "THE ABSOLUTE SWISS SIMULATOR &bull; STAGE 02";
      } else {
        currentStage = 1;
        gradient.addColorStop(0, '#0284c7');
        gradient.addColorStop(1, '#bae6fd');
        document.getElementById('hud-text').innerHTML = "THE ABSOLUTE SWISS SIMULATOR &bull; STAGE 01";
      }

      context.fillStyle = gradient;
      context.fillRect(0, 0, 2, 2);
      
      sphere.material.map = new THREE.CanvasTexture(canvas);
      sphere.material.needsUpdate = true;
      forceGraphicsRefresh();
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
    }

    function update() {
      lat = Math.max(-85, Math.min(85, lat));
      phi = THREE.MathUtils.degToRad(90 - lat);
      theta = THREE.MathUtils.degToRad(lon);

      const x = 500 * Math.sin(phi) * Math.sin(theta);
      const y = 500 * Math.cos(phi);
      const z = 500 * Math.sin(phi) * Math.cos(theta);

      camera.lookAt(x, y, z);
      renderer.render(scene, camera);
    }
  </script>

</body>
</html>
