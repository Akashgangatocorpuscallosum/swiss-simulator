<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Absolute Swiss Simulator</title>
  <!-- Loading our core 3D simulation framework securely -->
  <script src="https://aframe.io"></script>
  
  <style>
    body, html { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; background-color: #0f172a; }
    
    #concierge-hud {
      position: absolute; bottom: 20px; left: 20px; z-index: 10;
      background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2); padding: 15px 25px;
      color: #fff; border-radius: 4px; letter-spacing: 2px; font-size: 12px;
    }

    .concierge-drawer {
      position: absolute; top: 0; right: -350px; width: 300px; height: 100%;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
      border-left: 1px solid rgba(255, 255, 255, 0.1); z-index: 20;
      padding: 40px 25px; color: #E2E8F0; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .drawer-active { right: 0; }

    .drawer-title { font-size: 16px; font-weight: 300; letter-spacing: 3px; color: #F59E0B; margin-bottom: 15px; text-transform: uppercase; }
    .drawer-meta { font-size: 11px; text-transform: uppercase; color: #94A3B8; letter-spacing: 1px; margin-bottom: 5px; }
    .drawer-value { font-size: 14px; margin-bottom: 20px; font-weight: 400; line-height: 1.6; }
    
    .close-btn { background: none; border: none; color: #94A3B8; cursor: pointer; float: right; font-size: 18px; font-weight: 200; }
    .close-btn:hover { color: #fff; }

    .currency-selector { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
    .currency-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94A3B8; padding: 5px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; }
    .currency-btn.active { border-color: #F59E0B; color: #F59E0B; background: rgba(245, 158, 11, 0.1); }

    .transit-btn { background: #D00000; border: none; color: white; width: 100%; padding: 12px; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; cursor: pointer; margin-top: 10px; border-radius: 4px; transition: background 0.3s; }
    .transit-btn:hover { background: #A00000; }
  </style>

  <script>
    let currentCurrency = 'INR';
    let currentStage = 'airport';

    function setCurrency(matrixCode) {
      currentCurrency = matrixCode;
      document.querySelectorAll('.currency-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${matrixCode}`).classList.add('active');
      openConciergeDrawer(currentStage);
    }

    // Teleports you instantly into the alpine lake cruise visual zone
    function triggerStageTransit() {
      currentStage = 'train';
      // Changes the sky dome texture calculation dynamically to a pristine turquoise lake water color
      document.getElementById('skybox').setAttribute('color', '#0284c7'); 
      document.getElementById('hud-text').innerHTML = "THE ABSOLUTE SWISS SIMULATOR &bull; STAGE 02";
      openConciergeDrawer('train');
    }

    function openConciergeDrawer(type) {
      currentStage = type;
      const drawer = document.getElementById('luxury-drawer');
      const title = document.getElementById('d-title');
      const content = document.getElementById('d-content');
      
      let costValue = "";
      
      if (type === 'airport') {
        if (currentCurrency === 'INR') costValue = "₹45,000 per single luxury night.";
        else if (currentCurrency === 'CHF') costValue = "CHF 480 per single luxury night.";
        else if (currentCurrency === 'USD') costValue = "\$540 per single luxury night.";

        title.innerText = "Stage 1: Arrival Terminal";
        content.innerHTML = `
          <div class="currency-selector">
            <button id="btn-INR" class="currency-btn ${currentCurrency==='INR'?'active':''}" onclick="setCurrency('INR')">INR (₹)</button>
            <button id="btn-CHF" class="currency-btn ${currentCurrency==='CHF'?'active':''}" onclick="setCurrency('CHF')">CHF</button>
            <button id="btn-USD" class="currency-btn ${currentCurrency==='USD'?'active':''}" onclick="setCurrency('USD')">USD ($)</button>
          </div>
          <div class="drawer-meta">Est. Luxury Hotel Cost</div>
          <div class="drawer-value" style="color: #F59E0B; font-weight: bold;">${costValue}</div>
          <div class="drawer-meta" style="color: #EF4444;">🛑 MANDATORY Packing</div>
          <div class="drawer-value">&bull; Swiss Travel Pass QR Pass<br>&bull; Multi-region Premium Insurance</div>
          <button class="transit-btn" onclick="triggerStageTransit()">Board Alpine Train</button>
        `;
      } 
      else if (type === 'train') {
        if (currentCurrency === 'INR') costValue = "₹4,200 per 1st Class Panoramic Ticket.";
        else if (currentCurrency === 'CHF') costValue = "CHF 45 per 1st Class Panoramic Ticket.";
        else if (currentCurrency === 'USD') costValue = "\$50 per 1st Class Panoramic Ticket.";

        title.innerText = "Stage 2: Swiss Rail Link";
        content.innerHTML = `
          <div class="currency-selector">
            <button id="btn-INR" class="currency-btn ${currentCurrency==='INR'?'active':''}" onclick="setCurrency('INR')">INR (₹)</button>
            <button id="btn-CHF" class="currency-btn ${currentCurrency==='CHF'?'active':''}" onclick="setCurrency('CHF')">CHF</button>
            <button id="btn-USD" class="currency-btn ${currentCurrency==='USD'?'active':''}" onclick="setCurrency('USD')">USD ($)</button>
          </div>
          <div class="drawer-meta">Transit Carriage Fare</div>
          <div class="drawer-value" style="color: #F59E0B; font-weight: bold;">${costValue}</div>
          <div class="drawer-meta" style="color: #60A5FA;">📜 Strict Behavior Protocol</div>
          <div class="drawer-value">Keep conversational tones whisper-quiet in Swiss Travel Coach Quiet Zones. Never obstruct doorways with heavy baggage.</div>
        `;
      }
      drawer.classList.add('drawer-active');
    }

    function closeConciergeDrawer() {
      document.getElementById('luxury-drawer').classList.remove('drawer-active');
    }

    AFRAME.registerComponent('drawer-trigger', {
      init: function () {
        this.el.addEventListener('click', () => { openConciergeDrawer(currentStage); });
      }
    });
  </script>
</head>
<body>

  <div id="concierge-hud">
    <span id="hud-text">THE ABSOLUTE SWISS SIMULATOR &bull; STAGE 01</span>
  </div>

  <div id="luxury-drawer" class="concierge-drawer">
    <button class="close-btn" onclick="closeConciergeDrawer()">&times;</button>
    <div id="d-title" class="drawer-title">Concierge Desk</div>
    <div id="d-content">Select a point in space to inspect itinerary details.</div>
  </div>

  <a-scene embedded style="position: absolute; top:0; left:0; width:100%; height:100%;">
    
    <!-- THE PROCEDURAL ENVIRONMENT GENERATOR -->
    <!-- We inject a gorgeous sky dawn color gradient (#a5f3fc) that wraps your screen perfectly with 0 gaps! -->
    <a-sky id="skybox" color="#7dd3fc" radius="5000"></a-sky>

    <!-- Visual 3D floor plane grid mapping out the pedestrian walking lanes -->
    <a-grid position="0 0 0" rotation="-90 0 0" width="100" height="100" src="https://aframe.io" repeat="100 100" visible="false"></a-grid>

    <!-- Luxury Minimalist glowing concierge ring wrapper node -->
    <a-ring position="0 1.5 -3" radius-inner="0.15" radius-outer="0.18" color="#FFF" drawer-trigger
            animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1200; loop: true">
      <a-circle radius="0.14" color="#F59E0B" opacity="0.4"></a-circle>
    </a-ring>

    <!-- Interactive tracking view camera pointer reticle -->
    
      
      
    
  </a-scene>

</body>
</html>
