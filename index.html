<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Absolute Swiss Simulator - Panoramic Tour</title>
  <!-- Loading the professional 3D graphics rendering engine core safely -->
  <script src="https://cloudflare.com"></script>
  
  <style>
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000;
    }
    /* 3D Canvas Layer Container Setup */
    #panorama-viewport {
      width: 100%; height: 100%; cursor: grab;
    }
    #panorama-viewport:active { cursor: grabbing; }
  </style>
</head>
<body>

  <!-- THE 3D VIEWPORT LAYER CONTAINER -->
  <div id="panorama-viewport"></div>

  <!-- THREE.JS 3D ENGINE GRAPHICS CARD ROUTINE -->
  <script>
    let scene, camera, renderer, sphere, textureLoader;
    let isUserInteracting = false;
    let onPointerDownPointerX = 0, onPointerDownPointerY = 0;
    let lon = 0, onPointerDownLon = 0;
    let lat = 0, onPointerDownLat = 0;
    let phi = 0, theta = 0;

    // Track our current panoramic location stage
    let currentStage = 1;

    init();
    animate();

    function init() {
      const container = document.getElementById('panorama-viewport');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);

      // Construct a perfect 3D bubble dome shell
      const geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1, 1, 1); // Invert the sphere out so you stand cleanly on the inside

      textureLoader = new THREE.TextureLoader();
      
      // Load Stage 1: The Main Alpine View
      const texture = textureLoader.load('swiss-pano.jpg');
      const material = new THREE.MeshBasicMaterial({ map: texture });
      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);

      // WebGL Renderer Core mapping setup
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Desktop First-Person Mouse Track Bindings
      document.addEventListener('pointerdown', onPointerDown, false);
      
      // Double-click anywhere on the screen to transit between Stage 1 and Stage 2!
      document.addEventListener('dblclick', triggerStageTransit, false);
      
      window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onPointerDown(event) {
      isUserInteracting = true;
      onPointerDownPointerX = event.clientX;
      onPointerDownPointerY = event.clientY;
      onPointerDownLon = lon;
      onPointerDownLat = lat;
      document.addEventListener('pointermove', onPointerMove, false);
      document.addEventListener('pointerup', onPointerUp, false);
    }

    function onPointerMove(event) {
      if (isUserInteracting === false) return;
      lon = (onPointerDownPointerX - event.clientX) * 0.1 + onPointerDownLon;
      lat = (event.clientY - onPointerDownPointerY) * 0.1 + onPointerDownLat;
    }

    function onPointerUp() {
      isUserInteracting = false;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
    }

    // Transit function to switch between your panoramic scenery views seamlessly
    function triggerStageTransit() {
      if (currentStage === 1) {
        currentStage = 2;
        const nextTexture = textureLoader.load('train-pano.jpg');
        sphere.material.map = nextTexture;
        sphere.material.needsUpdate = true;
      } else {
        currentStage = 1;
        const prevTexture = textureLoader.load('swiss-pano.jpg');
        sphere.material.map = prevTexture;
        sphere.material.needsUpdate = true;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
    }

    function update() {
      lat = Math.max(-85, Math.min(85, lat));
      phi = THREE.MathUtils.degToRad(90 - lat);
      theta = THREE.MathUtils.degToRad(lon);

      const x = 500 * Math.sin(phi) * Math.sin(theta);
      const y = 500 * Math.cos(phi);
      const z = 500 * Math.sin(phi) * Math.cos(theta);

      camera.lookAt(x, y, z);
      renderer.render(scene, camera);
    }
  </script>

</body>
</html>
