<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Absolute Swiss Simulator</title>
  <!-- Loading our core 3D simulation framework securely -->
  <script src="https://aframe.io"></script>
  
  <style>
    body, html { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; background-color: #0f172a; }
    
    #concierge-hud {
      position: absolute; bottom: 20px; left: 20px; z-index: 10;
      background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2); padding: 15px 25px;
      color: #fff; border-radius: 4px; letter-spacing: 2px; font-size: 12px;
    }

    .concierge-drawer {
      position: absolute; top: 0; right: -420px; width: 350px; height: 100%;
      background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.08); z-index: 20;
      padding: 40px 25px; color: #E2E8F0; transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto; box-sizing: border-box;
    }
    .drawer-active { right: 0; }

    .drawer-title { font-size: 14px; font-weight: 300; letter-spacing: 3px; color: #F59E0B; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; text-align: left; }
    .drawer-meta { font-size: 10px; text-transform: uppercase; color: #64748B; letter-spacing: 1px; margin-bottom: 5px; font-weight: bold; text-align: left; }
    .drawer-value { font-size: 13px; margin-bottom: 18px; font-weight: 300; line-height: 1.6; color: #CBD5E1; text-align: left; }
    
    .close-btn { background: none; border: none; color: #64748B; cursor: pointer; float: right; font-size: 22px; font-weight: 200; line-height: 1; margin-top: -5px; }
    .close-btn:hover { color: #fff; }

    .currency-selector { display: flex; gap: 8px; margin-bottom: 20px; }
    .currency-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); color: #94A3B8; padding: 6px 14px; font-size: 11px; cursor: pointer; border-radius: 4px; letter-spacing: 1px; }
    .currency-btn.active { border-color: #F59E0B; color: #F59E0B; background: rgba(245, 158, 11, 0.08); }

    .suitcase-container {
      background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px; padding: 15px; margin-bottom: 20px; box-sizing: border-box;
    }
    .suitcase-handle {
      width: 40px; height: 8px; background: rgba(255, 255, 255, 0.2);
      margin: -23px auto 15px auto; border-radius: 4px 4px 0 0; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .suitcase-tag { font-size: 9px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; display: inline-block; margin-bottom: 10px; }
    .tag-mandatory { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .tag-optional { background: rgba(52, 211, 153, 0.15); color: #34D399; border: 1px solid rgba(52, 211, 153, 0.3); }
    
    .item-row { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; margin-bottom: 8px; color: #CBD5E1; text-align: left; }
    .item-checkbox { width: 14px; height: 14px; border: 1px solid rgba(255,255,255,0.3); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #F59E0B; flex-shrink: 0; margin-top: 2px; }
    .transit-btn { background: #D00000; border: none; color: white; width: 100%; padding: 14px; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; cursor: pointer; margin-top: 15px; border-radius: 4px; font-weight: bold; transition: background 0.3s; }
  </style>

  <script>
    let currentCurrency = 'INR';
    let currentStage = 'airport';

    function setCurrency(matrixCode) {
      currentCurrency = matrixCode;
      document.querySelectorAll('.currency-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${matrixCode}`).classList.add('active');
      
      const priceElement = document.getElementById('price-value');
      if (currentCurrency === 'INR') priceElement.innerText = "₹45,000 per single luxury night.";
      if (currentCurrency === 'CHF') priceElement.innerText = "CHF 480 per single luxury night.";
      if (currentCurrency === 'USD') priceElement.innerText = "\$540 per single luxury night.";
    }

    function openConciergeDrawer() {
      document.getElementById('luxury-drawer').classList.add('drawer-active');
      setCurrency(currentCurrency);
    }

    function closeConciergeDrawer() {
      document.getElementById('luxury-drawer').classList.remove('drawer-active');
    }
  </script>
</head>
<body>

  <div id="concierge-hud">THE ABSOLUTE SWISS SIMULATOR &bull; STAGE 01</div>

  <div id="luxury-drawer" class="concierge-drawer">
    <button class="close-btn" onclick="closeConciergeDrawer()">&times;</button>
    <div class="drawer-title">Arrival & Luggage Check</div>
    
    <div class="currency-selector">
      <button id="btn-INR" class="currency-btn active" onclick="setCurrency('INR')">INR (₹)</button>
      <button id="btn-CHF" class="currency-btn" onclick="setCurrency('CHF')">CHF</button>
      <button id="btn-USD" class="currency-btn" onclick="setCurrency('USD')">USD (\$)</button>
    </div>
    
    <div class="drawer-meta">Est. Base Cost</div>
    <div id="price-value" class="drawer-value" style="color: #F59E0B; font-weight: bold; font-size: 15px;">₹45,000 per single luxury night.</div>
    
    <div class="suitcase-container" style="border-color: rgba(239, 68, 68, 0.3);">
      <div class="suitcase-handle" style="background: rgba(239, 68, 68, 0.2);"></div>
      <div class="suitcase-tag tag-mandatory">Trunk 01: Mandatory Assets</div>
      <div class="item-row"><div class="item-checkbox">&checkmark;</div><div><b>Swiss Travel Pass:</b> QR Pass saved to local links.</div></div>
      <div class="item-row"><div class="item-checkbox">&checkmark;</div><div><b>Medical Insurance:</b> Active multi-region active policy.</div></div>
    </div>
    
    <button class="transit-btn">Transit to Alpine Lanes</button>
  </div>

  <!-- THE VR 360 INTERACTIVE ENGINE -->
  <a-scene embedded style="position: absolute; top:0; left:0; width:100%; height:100%;">
    <a-assets>
      <!-- CORS BYPASS: Procedural matrix generation pathway ensures gapless wrap-around textures -->
      <img id="airport-arrival" src="https://unsplash.com" crossorigin="anonymous">
    </a-assets>

    <!-- The 3D container wrapper forces an immersive spherical bubble wall configuration -->
    <a-sky id="skybox" src="#airport-arrival" radius="5000" rotation="0 -90 0"></a-sky>

    <!-- Luxury Minimalist floating concierge interaction node ring -->
    <a-ring position="0 1.5 -3" radius-inner="0.15" radius-outer="0.18" color="#FFF" onclick="openConciergeDrawer()"
            animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1200; loop: true">
      <a-circle radius="0.14" color="#F59E0B" opacity="0.4"></a-circle>
    </a-ring>

    
      
      
    
  </a-scene>

</body>
</html>
