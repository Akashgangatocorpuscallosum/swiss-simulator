<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Absolute Swiss Simulator - Panoramic Movie Tour</title>
  
  <style>
    /* Reset & Full Screen Layer Setup */
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; user-select: none;
    }
    
    /* PURE HARDWARE-LIGHTWEIGHT 360° DOME ENGINE */
    #stage-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
      perspective: 900px; overflow: hidden; display: flex; justify-content: center; align-items: center;
    }
    
    /* Immersive 3D Space Box Wrapper Cube Configuration */
    .panorama-cube {
      width: 2000px; height: 2000px; position: absolute;
      transform-style: preserve-3d;
      transform: translateZ(600px) rotateX(0deg) rotateY(0deg);
      transition: transform 0.1s linear;
    }
    
    /* Mapping your flat images as giant seamless environment walls wrapping around you */
    .cube-face {
      position: absolute; width: 2000px; height: 2000px;
      background-size: cover; background-position: center; backface-visibility: hidden;
      background-color: #1e293b; /* Sleek charcoal fallback color */
    }
    
    /* Enforcing your strict local file paths natively with zero CORS blocks */
    .face-front { transform: rotateY(0deg) translateZ(-1000px); background-image: url('swiss-pano.jpg'); }
    .face-back  { transform: rotateY(180deg) translateZ(-1000px); background-image: url('swiss-pano.jpg'); }
    .face-left  { transform: rotateY(90deg) translateZ(-1000px); background-image: url('swiss-pano.jpg'); }
    .face-right { transform: rotateY(-90deg) translateZ(-1000px); background-image: url('swiss-pano.jpg'); }

    /* Top Left Status Bar */
    #concierge-hud {
      position: absolute; top: 30px; left: 30px; z-index: 10;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 15px 25px;
      color: #fff; border-radius: 4px; letter-spacing: 3px; font-size: 11px;
      text-transform: uppercase; pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- THE STATUS BAR HUD -->
  <div id="concierge-hud">
    <span id="hud-text">THE ABSOLUTE SWISS SIMULATOR &bull; STAGE 01</span>
  </div>

  <!-- THE INTERACTIVE 360 PANORAMIC VIEWPORT BOX ENGINE -->
  <div id="stage-container">
    <div id="cube-space" class="panorama-cube">
      <div class="cube-face face-front"></div>
      <div class="cube-face face-back"></div>
      <div class="cube-face face-left"></div>
      <div class="cube-face face-right"></div>
    </div>
  </div>

  <!-- FIRST-PERSON MOUSE DRAG AND TELEPORTATION TRANSIT ROUTINE -->
  <script>
    let cube = document.getElementById('cube-space');
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let rotation = { x: 0, y: 0 };
    let currentStage = 1;

    // First-Person Drag Rotation Controls
    document.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      let deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
      
      rotation.y += deltaMove.x * 0.15;
      rotation.x = Math.max(-45, Math.min(45, rotation.x - deltaMove.y * 0.15));
      
      cube.style.transform = `translateZ(600px) rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    document.addEventListener('mouseup', () => { isDragging = false; });

    // Double-Click To Transit Location Stages (Teleports from Airport to Alpine Rail Tracks!)
    document.addEventListener('dblclick', () => {
      if (currentStage === 1) {
        currentStage = 2;
        document.querySelectorAll('.cube-face').forEach(face => {
          face.style.backgroundImage = "url('train-pano.jpg')";
        });
        document.getElementById('hud-text').innerHTML = "THE ABSOLUTE SWISS SIMULATOR &bull; STAGE 02";
      } else {
        currentStage = 1;
        document.querySelectorAll('.cube-face').forEach(face => {
          face.style.backgroundImage = "url('swiss-pano.jpg')";
        });
        document.getElementById('hud-text').innerHTML = "THE ABSOLUTE SWISS SIMULATOR &bull; STAGE 01";
      }
    });
  </script>

</body>
</html>
